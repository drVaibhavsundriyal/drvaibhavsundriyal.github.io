name: Fetch logos
on:
  push:
    paths: [".github/workflows/fetch-logos.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download logos
        run: |
          mkdir -p assets/logos
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
          get() { curl -fsSL -A "$UA" -o "assets/logos/$1" "$2" || echo "FAILED $1"; }
          M=https://www.myhealthcare.life/wp-content
          get kloudrac.png     https://www.kloudrac.com/assets/img/logo/logo.png
          get max.png          $M/uploads/2024/10/MAX-1.png
          get myhealthcare.svg $M/themes/myhealthcarelife/assets/images/logo.svg
          get karkinos.png     https://www.karkinos.in/wp-content/uploads/2025/06/Karkinos-Logo-R-1-1-1.png
          get fortis.png       $M/uploads/2024/10/Fortis-2.png
          get sakra.png        $M/uploads/2024/10/sakra-hospital.png
          get rubyhall.png     $M/uploads/2024/10/ruby-clinic.png
          get reliance.png     $M/uploads/2024/10/rfh-logo.png
          get ckbirla.png      $M/uploads/2024/10/ckbbmb.png
          get paras.png        $M/uploads/2024/10/paras-health.png
          get sparsh.png       $M/uploads/2024/10/sparsh-hospital.png
          get ainu.png         $M/uploads/2025/01/Logo-AINU-1.png
          get iihmr.png        https://www.iihmrdelhi.edu.in/main-assets/images/iihmr-logo-new-old.png
          get sharda.png       https://www.sharda.ac.in/attachments/site_logo/logo111.png
          get medicamen.png    https://www.medicamen.com/public/uploads/logo.png
          get kailash.png      https://www.kailashhealthcare.com/Content/NewWebsite/Images/logo1.png
          ls -la assets/logos
      - name: Download background videos
        run: |
          mkdir -p assets/media
          curl -fsSL -o assets/media/hero.mp4  https://assets.mixkit.co/videos/31774/31774-720.mp4
          curl -fsSL -o assets/media/vitals.mp4 https://assets.mixkit.co/videos/46368/46368-720.mp4
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffmpeg -y -loglevel error -ss 2 -i assets/media/hero.mp4 -frames:v 1 -q:v 4 assets/media/hero.jpg
          ffmpeg -y -loglevel error -ss 2 -i assets/media/vitals.mp4 -frames:v 1 -q:v 4 assets/media/vitals.jpg
          ls -la assets/media
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logos assets/media
          git diff --cached --quiet || git commit -m "Add logos and background media"
          git push
